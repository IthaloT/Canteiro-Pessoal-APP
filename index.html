<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Canteiro Pessoal">
<meta name="theme-color" content="#0E0E0E">
<link rel="manifest" href="manifest.json">
<title>Canteiro Pessoal</title>
<style>
/* ── Variables ─────────────────────────────────────────────── */
:root{
  --bg:#0E0E0E; --s1:#161616; --s2:#1E1E1E; --s3:#262626;
  --b1:#2A2A2A; --b2:#383838;
  --acc:#7C6AE8; --acc-d:rgba(124,106,232,.1); --acc-g:rgba(124,106,232,.2);
  --acc-orange: #E87C2A; --acc-orange-d:rgba(232,124,42,.1); --acc-orange-g:rgba(232,124,42,.2);
  --text:#EDE8DF; --t2:#9A9A9A; --t3:#666;
  --ui-font:-apple-system,BlinkMacSystemFont,\'Segoe UI\',sans-serif;
  --green:#3D9E6A; --gd:rgba(61,158,106,.14);
  --yellow:#C9921A; --yd:rgba(201,146,26,.14);
  --red:#C84B4B; --rd:rgba(200,75,75,.12);
  --blue:#4A7FC1; --bd:rgba(74,127,193,.12);
  --r:10px; --rs:6px; --tr:.15s ease;
  --nav:56px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:Georgia,\'Times New Roman\',serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
body{display:flex;flex-direction:column;overflow:hidden}

/* ── Header ────────────────────────────────────────────────── */
#hdr{
  padding:12px 16px 10px;border-bottom:1px solid var(--b1);
  display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:nowrap;
  background:var(--bg);padding-top:max(12px,env(safe-area-inset-top));
  overflow:hidden;
}
.logo{font-size:18px;letter-spacing:-.3px;white-space:nowrap;flex-shrink:0}
.logo em{color:var(--acc-orange);font-style:normal}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--t3);flex-shrink:0;transition:background .3s}
.sync-dot.ok{background:var(--green)}
.sync-dot.err{background:var(--red)}
.sync-dot.syncing{background:var(--acc-orange);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.icon-btn{background:none;border:1px solid var(--b1);color:var(--t2);border-radius:var(--rs);padding:5px 10px;font-size:12px;cursor:pointer;font-family:Georgia,serif;transition:var(--tr)}
.icon-btn:hover{border-color:var(--acc);color:var(--acc)}

/* ── Nav (Bottom) ───────────────────────────────────────────── */
nav{
  display:flex;flex-direction:row;flex-shrink:0;
  background:var(--bg);z-index:50;
  border-top:1px solid var(--b1);order:99;
  padding-bottom:max(6px,env(safe-area-inset-bottom));
}
.tab{
  flex:1;padding:8px 2px 5px;text-align:center;
  font-family:var(--ui-font);font-size:9px;letter-spacing:.5px; font-weight: 500;
  text-transform:uppercase;cursor:pointer;color:var(--t3);
  background:none;border:none;border-top:2px solid transparent;
  transition:var(--tr);display:flex;flex-direction:column;align-items:center;gap:2px;
}
.tab-icon{font-size:17px;line-height:1}
.tab.active{color:var(--text);border-top-color:var(--acc-orange)}
.tab:hover:not(.active){color:var(--t2)}
@media(min-width:768px){
  nav{order:0;border-top:none;border-bottom:1px solid var(--b1);padding-bottom:0;position:static}
  .tab{flex-direction:row;gap:6px;padding:10px 8px;font-size:10px;letter-spacing:.7px;border-top:none;border-bottom:2px solid transparent}
  .tab.active{border-top:none;border-bottom-color:var(--acc-orange)}
  .tab-icon{font-size:14px}
}
@media(min-width:1024px){
  body{flex-direction:row}
  #hdr{display:none}
  nav{
    order:0;flex-direction:column;align-items:stretch;
    width:210px;min-width:210px;height:100%;
    border-bottom:none;border-right:1px solid var(--b1);border-top:none;
    padding:0;overflow:hidden;position:static;
    transition:width .22s cubic-bezier(.4,0,.2,1), min-width .22s cubic-bezier(.4,0,.2,1);
    flex-shrink:0;
  }
  nav.collapsed{width:54px;min-width:54px}
  .nav-logo{
    display:flex;align-items:center;gap:8px;
    padding:17px 14px 13px;font-size:15px;letter-spacing:-.3px;
    color:var(--text);border-bottom:1px solid var(--b1);
    font-family:Georgia,serif;white-space:nowrap;overflow:hidden;
    transition:padding .22s, opacity .18s;
  }
  .nav-logo em{color:var(--acc-orange);font-style:normal}
  .nav-logo-text{transition:opacity .18s;white-space:nowrap}
  nav.collapsed .nav-logo{opacity:0;height:0;padding:0;border-bottom:none;overflow:hidden}
  .nav-toggle-btn{
    width:100%;display:none;align-items:center;justify-content:center;
    padding:12px 0;border:none;border-bottom:1px solid var(--b1);
    background:none;color:var(--t3);cursor:pointer;font-size:16px;
    transition:color var(--tr), background var(--tr);flex-shrink:0;
  }
  .nav-toggle-btn:hover{color:var(--acc-orange);background:var(--s1)}
  nav.collapsed .nav-toggle-btn{border-bottom-color:var(--b1)}
  .nav-toggle-btn .toggle-arrow{display:inline-block;transition:transform .22s}
  nav.collapsed .nav-toggle-btn .toggle-arrow{transform:rotate(180deg)}
  .tab{
    flex-direction:row;gap:10px;padding:11px 16px;
    text-align:left;border-bottom:none;border-left:3px solid transparent;
    font-size:11px;letter-spacing:.5px;justify-content:flex-start;
    border-radius:0;border-top:none;overflow:hidden;white-space:nowrap;
    transition:padding .22s;
  }
  .tab.active{border-left-color:var(--acc-orange);border-bottom:none;background:var(--s1)}
  .tab:hover:not(.active){background:var(--s1)}
  .tab-icon{font-size:16px;flex-shrink:0}
  .tab-lbl{transition:opacity .18s, width .22s;overflow:hidden;white-space:nowrap}
  nav.collapsed .tab{padding:11px 0;justify-content:center;border-left:3px solid transparent;position:relative}
  nav.collapsed .tab-lbl{opacity:0;width:0;overflow:hidden}
  nav.collapsed .tab::after{
    content:attr(data-tip);position:absolute;left:58px;top:50%;transform:translateY(-50%);
    background:var(--s2);border:1px solid var(--b1);border-radius:var(--rs);
    padding:4px 10px;font-size:11px;color:var(--text);white-space:nowrap;
    pointer-events:none;opacity:0;transition:opacity .15s;z-index:100;
    font-family:var(--ui-font);
  }
  nav.collapsed .tab:hover::after{opacity:1}
  main{flex:1;min-width:0;overflow:hidden}
}
/* ── Main ──────────────────────────────────────────────────── */
main{flex:1;overflow:hidden;display:flex;flex-direction:column;min-height:0}
.sec{display:none;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px}
.sec.active{display:block}
@media(min-width:1024px){
  .sec.active{display:flex;flex-direction:column}
}

/* ── Section title ──────────────────────────────────────────── */
.sec-h{font-size:9px;letter-spacing:1.8px;text-transform:uppercase;color:var(--t3);margin-bottom:12px;padding-bottom:7px;border-bottom:1px solid var(--b1);display:flex;align-items:center;justify-content:space-between;font-family:var(--ui-font)}
.badge{background:var(--s2);border:1px solid var(--b1);border-radius:10px;padding:1px 7px;font-size:10px;color:var(--t2)}

/* ── Inputs & Buttons ──────────────────────────────────────── */
input[type=text],input[type=date],input[type=number],textarea,select{width:100%;background:var(--s1);border:1px solid var(--b1);border-radius:var(--rs);color:var(--text);padding:9px 11px;font-size:14px;font-family:var(--ui-font);outline:none;transition:border-color var(--tr);resize:none}
input:focus,textarea:focus,select:focus{border-color:var(--acc)}
textarea{min-height:72px}
select{appearance:none;cursor:pointer}
select option{background:var(--s2)}
.btn{padding:8px 15px;border-radius:var(--rs);font-size:13px;cursor:pointer;border:none;font-family:var(--ui-font);transition:var(--tr);letter-spacing:.1px;font-weight:600;}
.btn-a{background:var(--acc);color:#FFF;}
.btn-a:hover{background:#937FF0}
.btn-orange{background:var(--acc-orange);color:#0E0E0E;}
.btn-orange:hover{background:#ff9d57;}
.btn-g{background:none;border:1px solid var(--b1);color:var(--t2)}
.btn-g:hover{border-color:var(--b2);color:var(--text)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-red{background:none;border:1px solid var(--red);color:var(--red)}
.btn-red:hover{background:var(--rd)}

/* ── Empty state ─────────────────────────────────────────────── */
.empty{text-align:center;padding:20px 0;color:var(--t3);font-size:13px;line-height:1.7}

/* ═══════════════════════════════════════════════════════════
   ROTINA (Refactored)
═══════════════════════════════════════════════════════════ */
#sec-rotina { padding: 0; }
.rotina-header {
  padding: max(16px, env(safe-area-inset-top)) 16px 16px;
  background: var(--bg);
  border-bottom: 1px solid var(--b1);
  position: sticky; top: 0; z-index: 10;
}
.rotina-header-title { font-size: 18px; font-weight: bold; margin-bottom: 4px; }
.rotina-header-date { font-size: 12px; color: var(--t2); font-family: var(--ui-font); margin-bottom: 12px; }
.rotina-summary-badges { display: flex; gap: 8px; }
.summary-badge {
  flex: 1; text-align: center; padding: 4px 6px; border-radius: var(--rs);
  font-size: 11px; font-family: var(--ui-font); font-weight: 600;
  transition: all var(--tr); display: flex; align-items: center; justify-content: center; gap: 5px;
}
.summary-badge.desafios { background: var(--acc-orange-d); color: var(--acc-orange); border: 1px solid var(--acc-orange-g); }
.summary-badge.habitos { background: var(--gd); color: var(--green); border: 1px solid rgba(61,158,106,.4); }
.summary-badge.vicios { background: var(--acc-d); color: var(--acc); border: 1px solid var(--acc-g); }
.summary-badge.done { background: var(--s3); color: var(--t3); border-color: var(--b1); }
.summary-badge.done .icon { filter: grayscale(1); opacity: .7; }
.summary-badge .count { font-weight: 700; }

.rotina-scroll-container {flex: 1; overflow-y: auto; padding: 16px; }
.rotina-section-title {
  font-size: 10px; font-weight: 700; letter-spacing: 1.5px;
  text-transform: uppercase; color: var(--t2); font-family: var(--ui-font);
  margin: 16px 0 10px; display: flex; align-items: center; gap: 6px;
}
.rotina-card {
  background: var(--s2); border: 1px solid var(--b1);
  border-radius: var(--r); padding: 12px 14px; margin-bottom: 10px;
  display: flex; align-items: center; gap: 10px;
  animation: fadeIn .18s ease; position: relative;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(-3px)}}
.rotina-card-main { flex: 1; min-width: 0; }
.rotina-card-title { font-size: 15px; font-weight: 500; color: var(--text); margin-bottom: 5px; display: flex; align-items: center; gap: 6px; }
.rotina-card-title .streak-fire { filter: grayscale(100%) opacity(0.6); font-size: 12px; }
.rotina-card-title .streak-fire.on-fire {
    filter: none;
    animation: pulse-fire .8s infinite alternate;
}
@keyframes pulse-fire {
  from { filter: drop-shadow(0 0 3px var(--yellow)); }
  to { filter: drop-shadow(0 0 6px var(--acc-orange)); }
}

.rotina-card-progress-bar {
  height: 3px; background: var(--s3); border-radius: 2px;
  overflow: hidden; margin: 8px 0 5px;
}
.rotina-card-progress-fill { height: 100%; background: var(--acc); transition: width .3s; }
.rotina-card-meta { font-size: 11px; color: var(--t2); font-family: var(--ui-font); }
.breadcrumb-trail { font-size: 10px; color: var(--t3); font-style: italic; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 5px; }

.rotina-card-button {
  flex-shrink: 0; padding: 10px 18px; border-radius: var(--rs);
  font-size: 13px; font-weight: 700; cursor: pointer; border: none;
  font-family: var(--ui-font); transition: var(--tr);
}
.rotina-card-button.check { background: var(--acc); color: white; }
.rotina-card-button.resist { background: var(--acc-orange); color: var(--bg); }

/* ═══════════════════════════════════════════════════════════
   CADERNO (Refactored for mobile)
═══════════════════════════════════════════════════════════ */
.inbox-bar{display:flex;gap:8px;margin-bottom:14px;}
.inbox-bar input{flex:1}
.inbox-item{background:var(--s1);border:1px solid var(--b1);border-radius:var(--rs);padding:10px 12px;margin-bottom:6px;display:flex;align-items:center;gap:8px;animation:fadeIn .18s ease}
.inbox-txt{flex:1;font-size:14px;line-height:1.4;word-break:break-word}
.inbox-actions { display: flex; align-items: center; gap: 8px; }
.triage-btn{background:var(--acc-d);border:1px solid var(--acc-g);color:var(--acc);border-radius:var(--rs);padding:4px 9px;font-size:11px;font-weight:bold;cursor:pointer;white-space:nowrap;font-family:var(--ui-font);transition:var(--tr);flex-shrink:0}
.triage-btn:hover{background:var(--acc);color:#FFF}
.xbtn{background:none;border:none;color:var(--t3);font-size:16px;cursor:pointer;padding:0 3px;line-height:1;flex-shrink:0}
.xbtn:hover{color:var(--red)}

.kanban-v-section { background: var(--s1); border: 1px solid var(--b1); border-radius: var(--r); overflow: hidden; margin-bottom:10px;}
.kanban-v-header {
  padding: 12px 14px; cursor: pointer; user-select: none;
  display: flex; align-items: center; justify-content: space-between;
  font-size: 10px; font-weight: 700; letter-spacing: 1.2px; color: var(--t2);
  text-transform: uppercase; font-family: var(--ui-font);
}
.kanban-v-header.fazendo { color: var(--acc-orange); }
.kanban-v-header.feito { color: var(--green); }
.kanban-v-body { padding: 4px 10px 10px; border-top: 1px solid var(--b1); }
.kanban-v-section:not(.open) .kanban-v-body { display: none; }
.kanban-v-card {
  background: var(--s2); border: 1px solid var(--b1);
  border-radius: var(--rs); padding: 10px; margin-bottom: 6px;
  font-family: var(--ui-font);
}
.kanban-v-card-content {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
}
.kanban-v-card-text { font-size: 13px; color: var(--text); flex: 1; cursor: pointer; }
.kanban-v-card-desc {
    font-size: 11px; color: var(--t3); margin-top: 4px;
    display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden;
}
.kanban-v-card-desc.open { -webkit-line-clamp: unset; }
.kanban-v-card .move-btn {
  padding: 6px 12px; font-size: 11px; font-weight: 600; white-space: nowrap; flex-shrink: 0;
}

/* Original Kanban for Desktop */
.k-col-hdr{font-size:9px;font-weight:bold;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;font-family:var(--ui-font)}
.k-afazer .k-col-hdr{color:var(--t2)}
.k-fazendo .k-col-hdr{color:var(--acc-orange)}
.k-feito .k-col-hdr{color:var(--green)}
.k-card{background:var(--s2);border:1px solid var(--b1);border-radius:var(--rs);padding:8px;margin-bottom:6px;font-size:12px;color:var(--text);line-height:1.4;cursor:grab;animation:fadeIn .18s ease;user-select:none;transition:box-shadow .15s}
.k-card:active{cursor:grabbing}
.k-card.dragging{opacity:.35;border-style:dashed;box-shadow:none}
.k-col.drag-over{background:var(--s3);border-color:var(--acc)}
.k-drop-indicator{height:3px;background:var(--acc-orange);border-radius:2px;margin:2px 0;pointer-events:none;animation:fadeIn .1s}
.k-card-top{display:flex;align-items:flex-start;gap:5px}
.k-card-txt{flex:1;word-break:break-word}
.kanban{
  display:flex;gap:10px;
  overflow-x:auto;scroll-snap-type:x mandatory;
  -webkit-overflow-scrolling:touch;
  padding-bottom:8px;margin:0 -16px;padding-left:16px;padding-right:16px;
  scrollbar-width:none;
}
.kanban::-webkit-scrollbar{display:none}
.k-col{
  background:var(--s1);border:1px solid var(--b1);border-radius:var(--r);
  padding:10px;min-height:120px;
  flex:0 0 85vw;max-width:340px;
  scroll-snap-align:center;
}
@media(min-width:1024px){
  .kanban-vertical { display: none; } /* Hide vertical on desktop */
  #sec-caderno{ flex-direction:row; gap:0; overflow:hidden }
  .caderno-left{
    width:320px; min-width:260px; max-width:380px;
    flex-shrink:0; border-right:1px solid var(--b1);
    display:flex; flex-direction:column; overflow:hidden;
    padding:16px;
  }
  .caderno-right{
    flex:1; display:flex; flex-direction:column;
    overflow:hidden; min-width:0; padding: 16px;
  }
  .caderno-inbox-wrap{ flex:1; overflow-y:auto; }
  .caderno-kanban-wrap{ flex:1; display:flex; flex-direction:column; overflow:hidden; }
  .caderno-kanban-wrap .kanban{
    flex:1; overflow:hidden; flex-wrap:nowrap;
    margin:0; padding:0; display: grid; grid-template-columns: 1fr 1fr 1fr;
  }
  .caderno-kanban-wrap .k-col{
    display:flex; flex-direction:column;
    height:100%; overflow:hidden;
    flex:1; max-width:none;
  }
  .caderno-kanban-wrap .k-col > div:last-child{ flex:1; overflow-y:auto; padding-bottom:8px; }
}
@media(max-width:1023px){
  .kanban { display: none; } /* Hide original on mobile */
}

/* ── Kebab menu ────────────────────────────────────────────── */
.kebab-wrap{position:relative;flex-shrink:0}
.kebab-btn{
  background:none;border:none;color:var(--t3);font-size:20px;cursor:pointer;
  padding:0px 6px;line-height:1;border-radius:var(--rs);transition:var(--tr);
  position: absolute; top: -8px; right: -4px;
}
.kebab-btn:hover{color:var(--text);background:var(--s3)}
.kebab-menu{
  position:fixed;z-index:1000;
  background:var(--s3);border:1px solid var(--b2);border-radius:var(--r);
  min-width:160px;padding:4px 0;box-shadow:0 6px 24px rgba(0,0,0,.55);
  display:none;animation:fadeIn .12s ease;
}
.kebab-menu.open{display:block}
.kebab-item{
  display:block;width:100%;padding:10px 16px;text-align:left;background:none;
  border:none;color:var(--text);font-size:13px;cursor:pointer;
  font-family:var(--ui-font);transition:var(--tr);white-space:nowrap;
  display: flex; align-items: center; gap: 8px;
}
.kebab-item:hover{background:var(--b1);color:var(--acc-orange)}
.kebab-item.danger{color:var(--red)}
.kebab-item.danger:hover{background:var(--rd)}

/* ── PRÉDIO & METAS ────────────────────────────────────────── */
.predio-nav{
  display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;
  padding:12px 16px 0;margin:0 -16px;border-bottom:1px solid var(--b1);
  position:sticky;top:0;background:var(--bg);z-index:20;flex-shrink:0;
}
.predio-nav::-webkit-scrollbar{display:none}
.predio-nav-tab{
  flex-shrink:0;padding:6px 12px;border:none;background:none;
  font-size:9px;letter-spacing:1.2px;text-transform:uppercase;
  color:var(--t3);font-family:var(--ui-font);cursor:pointer;
  border-bottom:2px solid transparent;transition:var(--tr);white-space:nowrap;
}
.predio-nav-tab.active{color:var(--acc-orange);border-bottom-color:var(--acc-orange)}
.predio-nav-tab:hover:not(.active){color:var(--t2)}
.floor{ display:none }
.floor.predio-active{ display:block; padding: 16px; }
@media(min-width:1024px) {
  #sec-predio { padding: 0; }
  .floor.predio-active { padding: 24px 32px; }
}
.predio-item{background:var(--s1);border:1px solid var(--b1);border-radius:var(--rs);padding:11px 12px;margin-bottom:7px;overflow:visible;position:relative}
.pi-top{display:flex;align-items:flex-start;gap:8px}
.pi-txt{flex:1;font-size:14px;line-height:1.4;word-break:break-word}
.pi-actions{display:flex;gap:5px;margin-top:0;align-items: center;}
.pi-check-btn{
  background:none;border:1px solid rgba(61,158,106,.4);color:var(--green);
  border-radius:var(--rs);padding:4px 10px;font-size:13px;cursor:pointer;
  font-family:var(--ui-font);transition:var(--tr);flex-shrink:0;
}
.pi-check-btn:hover{background:var(--gd);border-color:var(--green)}
.pi-nota-toggle{
  background:none;border:none;color:var(--t3);font-size:10px;
  cursor:pointer;font-family:var(--ui-font);padding:4px 0 0;
  letter-spacing:.3px;transition:color var(--tr);
}
.pi-nota-toggle:hover,.pi-nota-toggle.has-nota{color:var(--acc-orange)}
.pi-nota-area{
  width:100%;background:var(--s2);border:1px solid var(--b1);
  border-radius:var(--rs);color:var(--text);padding:7px 9px;
  font-size:12px;font-family:var(--ui-font);resize:none;
  min-height:52px;margin-top:5px;outline:none;
  transition:border-color var(--tr);
}
.pi-nota-area:focus{border-color:var(--acc)}


/* ── MODALS ────────────────────────────────────────────── */
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:300;display:none;align-items:flex-end;justify-content:center;padding:0;opacity:0;transition:opacity .2s;pointer-events:none}
.mbg.open{display:flex;opacity:1;pointer-events:all}
@media(min-width:500px){.mbg{align-items:center;padding:20px}}\n.modal{background:var(--s1);border:1px solid var(--b2);border-radius:16px 16px 0 0;padding:22px;width:100%;max-width:460px;position:relative;transform:translateY(20px);transition:transform .22s;max-height:92vh;overflow-y:auto}
.mbg.open .modal{transform:translateY(0)}
@media(min-width:500px){.modal{border-radius:14px}}
.m-title{font-size:15px;margin-bottom:14px;letter-spacing:-.2px}
.m-close{position:absolute;top:14px;right:14px;background:none;border:none;color:var(--t3);font-size:20px;cursor:pointer;line-height:1;padding:2px 6px}
.m-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.lbl{font-size:11px;color:var(--t2);margin-bottom:5px;font-family:var(--ui-font);letter-spacing:.3px}
.gap{margin-top:10px}
</style>
</head>
<body>

<!-- ── Offline banner, Toast, Kebab Menu ─────────────────── -->
<div id="offline-banner">📵 Sem conexão — o app continua funcionando normalmente</div>
<div id="toast"></div>
<div class="kebab-menu" id="kebab-menu-generic"></div>


<!-- ── Header ─────────────────────────────────────────────── -->
<div id="hdr">
  <span class="logo">Can<em>teiro</em> <span style="font-size:11px;color:var(--t2);font-weight:normal;letter-spacing:0">Pessoal</span></span>
  <div id="sync-dot" class="sync-dot" title="Status da sync"></div>
  <span id="sync-lbl" style="font-size:10px;color:var(--t3);font-family:var(--ui-font);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>
  <span class="version-badge" style="flex-shrink:0" title="Versão do app">v2.8</span>
  <button class="icon-btn" style="flex-shrink:0" onclick="openM('mbg-history')">Hist.</button>
  <button class="icon-btn" style="flex-shrink:0" onclick="openSettingsModal()">⚙</button>
</div>

<!-- ── Nav ────────────────────────────────────────────────── -->
<nav id="sidebar">
  <div class="nav-logo" style="display:none" id="nav-logo-desktop">
    <span><em>⬡</em> <span class="nav-logo-text">Canteiro</span></span>
  </div>
  <button class="nav-toggle-btn" id="nav-toggle-btn" onclick="toggleSidebar()" title="Recolher / expandir menu" style="display:none"><span class="toggle-arrow">‹</span></button>
  <button class="tab active" id="tab-rotina"   data-tip="Rotina"   onclick="setTab('rotina',this)"><span class="tab-icon">⚡</span><span class="tab-lbl">Rotina</span></button>
  <button class="tab"        id="tab-caderno"  data-tip="Caderno"  onclick="setTab('caderno',this)"><span class="tab-icon">📋</span><span class="tab-lbl">Caderno</span></button>
  <button class="tab"        id="tab-predio"   data-tip="Metas"    onclick="setTab('predio',this)"><span class="tab-icon">🎯</span><span class="tab-lbl">Metas</span></button>
  <button class="tab"        id="tab-contratos-nav"   data-tip="Contratos"    onclick="setTab('contratos',this)"><span class="tab-icon">📜</span><span class="tab-lbl">Contratos</span></button>
</nav>

<main>

<!-- ══ ROTINA (Refactored) ══════════════════════════════════════════════ -->
<div id="sec-rotina" class="sec active">
  <div class="rotina-header">
    <div class="rotina-header-title">Resumo do Dia</div>
    <div class="rotina-header-date" id="rotina-header-date-el"></div>
    <div class="rotina-summary-badges" id="rotina-summary-badges-el"></div>
  </div>
  <div class="rotina-scroll-container" id="rotina-scroll-container">
    <!-- Cards will be rendered by JS -->
  </div>
</div>

<!-- ══ CADERNO (Refactored) ══════════════════════════════════════════ -->
<div id="sec-caderno" class="sec">
    <!-- This container is for the desktop 2-column layout -->
    <div class="caderno-left">
        <div class="inbox-bar">
          <input type="text" id="inp-inbox" placeholder="Capturar ideia, pendência..." onkeydown="if(event.key==='Enter')addInbox()">
          <button class="btn btn-orange" onclick="addInbox()">+</button>
        </div>
        <div class="sec-h">Caixa de Entrada <span class="badge" id="inbox-cnt">0</span></div>
        <div id="list-inbox"></div>
    </div>
    <div class="caderno-right">
        <div class="sec-h">
            Kanban
            <button class="btn btn-g btn-sm" onclick="openDirectTask()">+ Tarefa</button>
        </div>
        <!-- Mobile Kanban -->
        <div class="kanban-vertical" id="kanban-vertical-container"></div>
        <!-- Desktop Kanban -->
        <div class="kanban">
            <div class="k-col k-afazer" data-col="afazer">
              <div class="k-col-hdr">A Fazer <span id="cnt-afazer" class="badge">0</span></div>
              <div id="col-afazer"></div>
            </div>
            <div class="k-col k-fazendo" data-col="fazendo">
              <div class="k-col-hdr">Fazendo <span id="cnt-fazendo" class="badge">0</span></div>
              <div id="col-fazendo"></div>
            </div>
            <div class="k-col k-feito" data-col="feito">
              <div class="k-col-hdr">Feito <span id="cnt-feito" class="badge">0</span></div>
              <div id="col-feito"></div>
            </div>
        </div>
    </div>
</div>

<!-- ══ METAS (PRÉDIO) ══════════════════════════════════════════════ -->
<div id="sec-predio" class="sec">
  <div class="predio-nav" id="predio-nav">
    <button class="predio-nav-tab active" onclick="setPredioTab('frentes',this)">AÇÕES</button>
    <button class="predio-nav-tab" onclick="setPredioTab('ciclos',this)">TRIMESTRE</button>
    <button class="predio-nav-tab" onclick="setPredioTab('horizontes',this)">LONGO PRAZO</button>
    <button class="predio-nav-tab" onclick="setPredioTab('pilares',this)">ÁREAS</button>
    <button class="predio-nav-tab" onclick="setPredioTab('fundacao',this)">PROPÓSITO</button>
  </div>
  <div id="list-predio-container" style="flex: 1; overflow-y: auto;">
      <!-- Active floor content will be rendered here -->
  </div>
</div>

<!-- ══ CONTRATOS ══════════════════════════════════════════════ -->
<div id="sec-contratos" class="sec">
    <!-- Content for Contratos -->
</div>

</main>

<!-- MODALS -->
<div class="mbg" id="mbg-triage">
    <div class="modal">
        <button class="m-close" onclick="closeM('mbg-triage')">×</button>
        <div id="triage-modal-content"></div>
    </div>
</div>
<div class="mbg" id="mbg-add-predi">
    <div class="modal">
        <button class="m-close" onclick="closeM('mbg-add-predi')">×</button>
        <div class="m-title" id="add-predi-title"></div>
        <input type="hidden" id="add-predi-tipo">
        <div class="lbl" id="add-predi-lbl-nome">Nome</div>
        <input type="text" id="inp-predi-nome">
        <div id="predi-desc-field" style="display:none">
            <div class="lbl gap">Descrição (opcional)</div>
            <textarea id="inp-predi-desc-generic" rows="2"></textarea>
        </div>
        <div id="horizonte-extras" style="display:none">
            <div class="lbl gap">Ano-alvo</div>
            <input type="number" id="inp-predi-ano">
        </div>
        <div id="predi-pilar-field" style="display:none">
            <div class="lbl gap">Vincular à Área (opcional)</div>
            <select id="inp-predi-pilar"></select>
        </div>
        <div class="m-actions">
            <button class="btn btn-g" onclick="closeM('mbg-add-predi')">Cancelar</button>
            <button class="btn btn-a" onclick="savePredi()">Adicionar</button>
        </div>
    </div>
</div>
<div class="mbg" id="mbg-confirm">
    <div class="modal">
      <button class="m-close" onclick="closeM('mbg-confirm')">×</button>
      <div class="m-title" id="confirm-msg"></div>
      <div class="m-actions">
        <button class="btn btn-g" onclick="closeM('mbg-confirm')">Cancelar</button>
        <button class="btn btn-red" id="confirm-ok">Confirmar</button>
      </div>
    </div>
</div>


<script>
/* ═══════════════════════════════════════════════════════════
   ESTADO & STORAGE
═══════════════════════════════════════════════════════════ */
const KEY = 'canteiro_v2.8';
function blank() {
  return {
    meta: { ultimaSync: null },
    settings: { scriptUrl: '' },
    fundacao: { missao: '' },
    pilares: [],
    horizontes: [], // Metas de Longo Prazo
    ciclos: [],     // Metas Trimestrais
    frentes: [],    // Ações
    habitos: [],
    vicios: [],
    desafios: [],
    inbox: [],
    tarefas: [],
    contratos: [],
    historico: []
  };
}

let S = (() => { try { return JSON.parse(localStorage.getItem(KEY)) || blank(); } catch { return blank(); } })();
if (!S.historico) S.historico = []; // Migration for old data

function persist() {
  localStorage.setItem(KEY, JSON.stringify(S));
  showToast('Salvo ✓');
}

/* ═══════════════════════════════════════════════════════════
   UTILITÁRIOS
═══════════════════════════════════════════════════════════ */
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function today() { return new Date().toISOString().split('T')[0]; }
function yesterday() { const d = new Date(); d.setDate(d.getDate() - 1); return d.toISOString().split('T')[0]; }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;'); }

/* ═══════════════════════════════════════════════════════════
   NAVEGAÇÃO
═══════════════════════════════════════════════════════════ */
function setTab(name, el) {
  document.querySelectorAll('.sec').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.getElementById('sec-' + name).classList.add('active');
  if (el) el.classList.add('active');
  const renders = {
    rotina: renderRotina,
    caderno: renderCaderno,
    predio: renderMetas,
    contratos: () => {}, // Placeholder
  };
  renders[name]?.();
}

/* ═══════════════════════════════════════════════════════════
   ROTINA (Refactored)
═══════════════════════════════════════════════════════════ */
function renderRotina() {
    renderRotinaHeader();
    renderRotinaLists();
}

function renderRotinaHeader() {
    const dateEl = document.getElementById('rotina-header-date-el');
    const badgesEl = document.getElementById('rotina-summary-badges-el');
    if (!dateEl || !badgesEl) return;

    const d = new Date();
    dateEl.textContent = d.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });

    const t = today();
    const desafiosNaoFeitos = (S.desafios || []).filter(item => !(item.registros || {})[t]).length;
    const habitosNaoFeitos = (S.habitos || []).filter(item => !(item.registros || {})[t]).length;
    const viciosNaoFeitos = (S.vicios || []).filter(item => !(item.registros || {})[t]).length;

    badgesEl.innerHTML = \`
        <div class="summary-badge desafios \${desafiosNaoFeitos === 0 ? 'done' : ''}"><span class="icon">🔥</span> <span class="count">\${desafiosNaoFeitos}</span></div>
        <div class="summary-badge habitos \${habitosNaoFeitos === 0 ? 'done' : ''}"><span class="icon">🧱</span> <span class="count">\${habitosNaoFeitos}</span></div>
        <div class="summary-badge vicios \${viciosNaoFeitos === 0 ? 'done' : ''}"><span class="icon">🛡️</span> <span class="count">\${viciosNaoFeitos}</span></div>
    \`;
}

function renderRotinaLists() {
    const container = document.getElementById('rotina-scroll-container');
    if (!container) return;

    const desafios = (S.desafios || []).map(item => renderRotinaCard(item, 'desafio')).join('');
    const habitos = (S.habitos || []).map(item => renderRotinaCard(item, 'habito')).join('');
    const vicios = (S.vicios || []).map(item => renderRotinaCard(item, 'vicio')).join('');

    container.innerHTML = \`
        \${desafios.length > 0 ? \`<div class="rotina-section-title">🔥 Desafios</div>\${desafios}\` : ''}
        \${habitos.length > 0 ? \`<div class="rotina-section-title">🧱 Hábitos</div>\${habitos}\` : ''}
        \${vicios.length > 0 ? \`<div class="rotina-section-title">🛡️ Vícios</div>\${vicios}\` : ''}
    \`;
}

function renderRotinaCard(item, type) {
    const t = today();
    const isDoneToday = (item.registros || {})[t] === true;
    if (isDoneToday) return ''; // Hide items already done today

    let title = item.nome;
    let metaText = '';
    let buttonText = '';
    let buttonClass = '';
    let onClickAction = '';
    let progress = 0;

    let streak = 0;
    if (item.registros) {
        let d = new Date(t);
        while(true) {
            const dateStr = d.toISOString().split('T')[0];
            if ((item.registros[dateStr] === true) || (item.registros[dateStr] === 'resistiu')) {
                streak++;
                d.setDate(d.getDate() - 1);
            } else {
                break;
            }
        }
    }
    const fireIcon = \`<span class="streak-fire \${streak > 0 ? 'on-fire' : ''}">🔥\${streak > 1 ? \` \${streak}\` : ''}</span>\`;

    switch (type) {
        case 'desafio':
            const diaAtual = item.inicioEm ? Math.floor((new Date(t) - new Date(item.inicioEm)) / 86400000) + 1 : 1;
            metaText = \`Dia \${diaAtual} / \${item.duracaoDias}\`;
            progress = (diaAtual / item.duracaoDias) * 100;
            buttonText = 'CHECK';
            buttonClass = 'check';
            onClickAction = \`markDone('\${type}', '\${item.id}')\`;
            break;
        case 'habito':
            metaText = \`Meta: \${item.freqAlvo || 'Diária'}\`;
            const weekStart = new Date();
            weekStart.setDate(weekStart.getDate() - weekStart.getDay() + 1);
            const weekDone = Object.keys(item.registros || {}).filter(d => new Date(d) >= weekStart && item.registros[d]).length;
            const target = item.freqAlvo ? (typeof item.freqAlvo === 'string' ? 7 : item.freqAlvo) : 7;
            progress = (weekDone / target) * 100;
            buttonText = 'CHECK';
            buttonClass = 'check';
            onClickAction = \`markDone('\${type}', '\${item.id}')\`;
            break;
        case 'vicio':
            metaText = \`Dia \${streak} de \${item.metaDias || '∞'}\`;
            progress = item.metaDias ? (streak / item.metaDias) * 100 : 0;
            buttonText = 'RESISTIR';
            buttonClass = 'resist';
            onClickAction = \`markDone('\${type}', '\${item.id}')\`;
            break;
    }

    const breadcrumb = generateBreadcrumb(item.pilarId || item.vinculoId, 'pilar');

    return \`
        <div class="rotina-card">
            <div class="rotina-card-main">
                <div class="rotina-card-title">\${streak > 0 ? fireIcon : ''} \${esc(title)}</div>
                \${breadcrumb ? \`<div class="breadcrumb-trail">\${breadcrumb}</div>\` : ''}
                <div class="rotina-card-progress-bar"><div class="rotina-card-progress-fill" style="width:\${progress}%"></div></div>
                <div class="rotina-card-meta">\${metaText}</div>
            </div>
            <button class="rotina-card-button \${buttonClass}" onclick="\${onClickAction}">\${buttonText}</button>
            <div class="kebab-wrap">
                <button class="kebab-btn" onclick="openRotinaKebab(event, '\${type}', '\${item.id}')">⋮</button>
            </div>
        </div>
    \`;
}

function markDone(type, id, date) {
    const item = S[type]?.find(i => i.id === id);
    if (!item) return;
    if (!item.registros) item.registros = {};
    const targetDate = date || today();
    item.registros[targetDate] = true;
    persist();
    renderRotina();
}

function openRotinaKebab(event, type, id) {
    event.stopPropagation();
    const menu = document.getElementById('kebab-menu-generic');
    const btn = event.currentTarget;
    const rect = btn.getBoundingClientRect();
    menu.innerHTML = \`
        <button class="kebab-item" onclick="markDone('\${type}', '\${id}', yesterday())">✓ Preencher Ontem</button>
        <button class="kebab-item" onclick="skipItem('\${type}', '\${id}')">↪️ Pular Hoje</button>
        <button class="kebab-item danger" onclick="failItem('\${type}', '\${id}')">✕ Falhei Hoje</button>
    \`;
    menu.style.top = (rect.bottom + 4) + 'px';
    menu.style.right = (window.innerWidth - rect.right) + 'px';
    menu.classList.add('open');
    const closeListener = e => {
        if (!menu.contains(e.target)) {
            menu.classList.remove('open');
            document.removeEventListener('click', closeListener);
        }
    };
    setTimeout(() => document.addEventListener('click', closeListener), 0);
}

function skipItem(type, id) {
    const item = S[type]?.find(i => i.id === id); if (!item) return;
    if (!item.registros) item.registros = {};
    item.registros[today()] = 'pulou';
    persist(); renderRotina(); showToast('Item pulado por hoje.');
}

function failItem(type, id) {
    const item = S[type]?.find(i => i.id === id); if (!item) return;
    if (!item.registros) item.registros = {};
    item.registros[today()] = 'falhou';
    persist(); renderRotina(); showToast('Falha registrada. Amanhã é um novo dia!');
}

/* ═══════════════════════════════════════════════════════════
   CADERNO (Refactored)
═══════════════════════════════════════════════════════════ */
function renderCaderno() {
    renderInbox();
    if (window.innerWidth < 1024) {
        renderKanbanVertical();
    } else {
        renderKanban();
    }
}

function addInbox() {
  const el = document.getElementById('inp-inbox');
  const txt = el.value.trim(); if (!txt) return;
  S.inbox.unshift({ id: uid(), texto: txt, data: today(), status: 'pendente' });
  el.value = ''; persist(); renderInbox();
}

function renderInbox() {
  const pend = (S.inbox || []).filter(x => x.status === 'pendente');
  document.getElementById('inbox-cnt').textContent = pend.length;
  const list = document.getElementById('list-inbox');
  list.innerHTML = pend.length > 0 ? pend.map(item => \`
    <div class="inbox-item">
      <div class="inbox-txt">\${esc(item.texto)}</div>
      <div class="inbox-actions">
          <button class="triage-btn" onclick="openTriage('\${item.id}')">Triar →</button>
          <button class="xbtn" onclick="discardInboxItem('\${item.id}')" title="Apagar">×</button>
      </div>
    </div>\`).join('') : '<div class="empty">Caixa de entrada limpa!</div>';
}

function discardInboxItem(id) {
    showConfirm('Apagar este item da caixa de entrada?', () => {
        S.inbox = (S.inbox || []).filter(i => i.id !== id);
        persist(); renderInbox();
    });
}

function openTriage(inboxId) {
    const item = S.inbox.find(i => i.id === inboxId); if (!item) return;
    const modalContent = document.getElementById('triage-modal-content');
    modalContent.innerHTML = \`
        <div class="m-title">Triar: \${esc(item.texto)}</div>
        <div class="lbl">Título</div>
        <input type="text" id="triage-title-edit" value="\${esc(item.texto)}">
        <div class="lbl gap">Descrição (opcional)</div>
        <textarea id="triage-desc" rows="3" placeholder="Detalhes, links, subtarefas..."></textarea>
        <div class="m-actions">
            <button class="btn btn-g" onclick="processTriage('\${item.id}', 'tarefa')">✓ Criar Tarefa</button>
            <button class="btn btn-g" onclick="processTriage('\${item.id}', 'acao')">📁 Criar Ação</button>
            <button class="btn-sm btn-red" onclick="discardInboxItem('\${item.id}'); closeM('mbg-triage');">🗑 Apagar</button>
        </div>
    \`;
    openM('mbg-triage');
}

function processTriage(inboxId, type) {
    const item = S.inbox.find(i => i.id === inboxId); if (!item) return;
    const newTitle = document.getElementById('triage-title-edit').value.trim();
    const newDesc = document.getElementById('triage-desc').value.trim();
    if (!newTitle) return;

    if (type === 'tarefa') {
        S.tarefas.push({ id: uid(), texto: newTitle, desc: newDesc, coluna: 'afazer', criadoEm: today() });
        showToast('Tarefa criada em "A Fazer"');
    } else if (type === 'acao') {
        closeM('mbg-triage');
        openAddPredi('frentes', newTitle);
        // This is a simplification. A better UX would pass the description.
        return;
    }
    item.status = 'triado';
    persist(); renderCaderno(); closeM('mbg-triage');
}

function renderKanbanVertical() {
    const container = document.getElementById('kanban-vertical-container');
    const colunas = {
        afazer: { label: 'A Fazer', tasks: (S.tarefas || []).filter(t => t.coluna === 'afazer') },
        fazendo: { label: 'Fazendo', tasks: (S.tarefas || []).filter(t => t.coluna === 'fazendo') },
        feito: { label: 'Feito', tasks: (S.tarefas || []).filter(t => t.coluna === 'feito') }
    };

    container.innerHTML = Object.keys(colunas).map(key => {
        const coluna = colunas[key];
        const moveButton = (task) => {
            if (key === 'afazer') return \`<button class="btn btn-orange btn-sm move-btn" onclick="moveKanbanTask('\${task.id}', 'fazendo')">Mover para Fazendo →</button>\`;
            if (key === 'fazendo') return \`<button class="btn btn-a btn-sm move-btn" onclick="moveKanbanTask('\${task.id}', 'feito')">Concluir ✓</button>\`;
            if (key === 'feito') return \`<button class="btn btn-g btn-sm move-btn" onclick="moveKanbanTask('\${task.id}', 'arquivar')">Finalizar / Arquivar</button>\`;
            return '';
        };

        return \`
            <div class="kanban-v-section open">
                <div class="kanban-v-header \${key}" onclick="this.parentElement.classList.toggle('open')">
                    \${coluna.label} <span class="badge">\${coluna.tasks.length}</span>
                </div>
                <div class="kanban-v-body">
                    \${coluna.tasks.length > 0 ? coluna.tasks.map(task => \`
                        <div class="kanban-v-card">
                           <div class="kanban-v-card-text" onclick="this.nextElementSibling.classList.toggle('open')">\${esc(task.texto)}</div>
                           <div class="kanban-v-card-desc">\${esc(task.desc)}</div>
                           <div style="text-align: right; margin-top: 8px;">\${moveButton(task)}</div>
                        </div>
                    \`).join('') : '<div class="empty" style="padding: 5px 0; font-size: 11px;">Vazio</div>'}
                </div>
            </div>
        \`;
    }).join('');
}

function moveKanbanTask(taskId, newColuna) {
    const task = S.tarefas.find(t => t.id === taskId);
    if (task) {
        if (newColuna === 'arquivar') {
            S.historico.unshift({ type: 'tarefa', nome: task.texto, statusFinal: 'arquivado', encerradoEm: today() });
            S.tarefas = S.tarefas.filter(t => t.id !== taskId);
        } else {
            task.coluna = newColuna;
        }
        persist();
        renderCaderno();
    }
}

// Original Kanban render for desktop
function renderKanban() {
  ['afazer', 'fazendo', 'feito'].forEach(col => {
    const tasks = (S.tarefas || []).filter(t => t.coluna === col).sort((a, b) => (a.ordem ?? 999) - (b.ordem ?? 999));
    document.getElementById('cnt-' + col).textContent = tasks.length;
    const colEl = document.getElementById('col-' + col);
    if (colEl) {
        colEl.innerHTML = tasks.length === 0
          ? '<div style="font-size:11px;color:var(--t3);padding:4px 0;">Vazio</div>'
          : tasks.map(t => \`<div class="k-card" draggable="true" data-id="\${t.id}" ondragstart="onCardDragStart(event,'\${t.id}')" ondragend="onCardDragEnd()"><div class="k-card-txt">\${esc(t.texto)}</div></div>\`).join('');
    }
  });
}
// Drag and drop logic from original file (for desktop) remains here...


/* ═══════════════════════════════════════════════════════════
   METAS (PRÉDIO)
═══════════════════════════════════════════════════════════ */
let activePredioTab = 'frentes';

function setPredioTab(id, btn) {
    activePredioTab = id;
    document.querySelectorAll('.predio-nav-tab').forEach(t => t.classList.remove('active'));
    if(btn) btn.classList.add('active');
    renderMetas();
}

function renderMetas() {
    const container = document.getElementById('list-predio-container');
    if (!container) return;
    
    if (activePredioTab === 'fundacao') {
        container.innerHTML = \`<div class="floor predio-active">
            <div class="sec-h">Propósito Maior</div>
            <textarea id="inp-missao" rows="4" placeholder="Qual a sua bússola inegociável?">\${esc(S.fundacao.missao)}</textarea>
            <div style="text-align:right; margin-top:8px"><button class="btn btn-a" onclick="saveMissao()">Salvar</button></div>
        </div>\`;
        return;
    }
    
    const tipoNomes = {frentes:'Ações',ciclos:'Metas Trimestrais',horizontes:'Metas de Longo Prazo',pilares:'Áreas de Foco'};
    const items = (S[activePredioTab] || []).filter(item => !item.arquivado);
    
    container.innerHTML = \`
        <div class="floor predio-active">
            <div class="sec-h">\${tipoNomes[activePredioTab]} <button class="btn btn-g btn-sm" onclick="openAddPredi('\${activePredioTab}')">+ Novo</button></div>
            \${items.length > 0 ? items.map(item => renderPredioItem(item, activePredioTab)).join('') : '<div class="empty">Nenhum item.</div>'}
        </div>
    \`;
}

function renderPredioItem(item, tipo) {
    const breadcrumb = generateBreadcrumb(item.pilarId);
    return \`<div class="predio-item">
        <div class="pi-top">
            <div class="pi-txt" style="flex:1">
                \${esc(item.nome || item.texto)}
                \${breadcrumb ? \`<div class="breadcrumb-trail">\${breadcrumb}</div>\` : ''}
            </div>
            <div class="pi-actions">
                <button class="pi-check-btn" title="Concluir" onclick="concluirPredioItem('\${tipo}','\${item.id}')">✓</button>
            </div>
        </div>
        <button class="pi-nota-toggle\${item.notas?' has-nota':''}" onclick="toggleNota(event, '\${item.id}')">📝 Notas</button>
        <div id="pi-nota-\${item.id}" style="display:none">
            <textarea class="pi-nota-area" onblur="saveNota('\${tipo}','\${item.id}',this.value)">\${esc(item.notas||'')}</textarea>
        </div>
    </div>\`;
}

function generateBreadcrumb(pilarId) {
    if (!pilarId) return '';
    const pilar = (S.pilares || []).find(p => p.id === pilarId);
    return pilar ? `📍 Área: \${esc(pilar.nome)}` : '';
}

function openAddPredi(tipo, initialNome = '') {
  const cfg = {frentes:{label:'Nova Ação'},ciclos:{label:'Nova Meta Trimestral'},horizontes:{label:'Nova Meta de Longo Prazo'},pilares:{label:'Nova Área de Foco'}}[tipo];
  document.getElementById('add-predi-title').textContent = cfg.label;
  document.getElementById('add-predi-tipo').value = tipo;
  document.getElementById('inp-predi-nome').value = initialNome;
  
  const anoExtras = document.getElementById('horizonte-extras');
  const anoInput = document.getElementById('inp-predi-ano');
  const pilarField = document.getElementById('predi-pilar-field');
  
  anoExtras.style.display = tipo === 'horizontes' ? 'block' : 'none';
  if (tipo === 'horizontes') { anoInput.min = new Date().getFullYear() + 1; }
  
  pilarField.style.display = tipo !== 'pilares' ? 'block' : 'none';
  if (tipo !== 'pilares') {
      const pilarSelect = document.getElementById('inp-predi-pilar');
      pilarSelect.innerHTML = '<option value="">Sem vínculo</option>' + (S.pilares || []).map(p => \`<option value="\${p.id}">\${esc(p.nome)}</option>\`).join('');
  }

  // Clear vicio name input
  if (tipo === 'vicios') {
      const vicioInput = document.getElementById('inp-vicio-nome'); // Assuming this is the ID
      if(vicioInput) vicioInput.value = '';
  }

  openM('mbg-add-predi');
}

function savePredi() {
    const tipo = document.getElementById('add-predi-tipo').value;
    const nome = document.getElementById('inp-predi-nome').value.trim();
    if (!nome) return;
    
    const newItem = { id: uid(), nome, criadoEm: today() };

    if (tipo === 'horizontes') {
        const ano = document.getElementById('inp-predi-ano').value;
        if (ano >= new Date().getFullYear() + 1) newItem.anoAlvo = ano;
        else return showToast('Ano-alvo para Metas de Longo Prazo deve ser no futuro.');
    }
    
    if (tipo !== 'pilares') {
        const pilarId = document.getElementById('inp-predi-pilar').value;
        if (pilarId) newItem.pilarId = pilarId;
    }

    if (!S[tipo]) S[tipo] = [];
    S[tipo].push(newItem);
    persist(); renderMetas(); closeM('mbg-add-predi');
}

function concluirPredioItem(tipo, id) {
    const item = S[tipo]?.find(i => i.id === id); if (!item) return;
    showConfirm(\`Marcar "\${item.nome}" como concluída?\`, () => {
        S.historico.unshift({ ...item, tipo, statusFinal: 'concluido', encerradoEm: today() });
        S[tipo] = S[tipo].filter(i => i.id !== id);
        persist(); renderMetas();
    });
}

function saveMissao() {
    S.fundacao.missao = document.getElementById('inp-missao').value;
    persist();
}

function toggleNota(event, id) {
    event.stopPropagation();
    const el = document.getElementById('pi-nota-' + id);
    if(el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
}

function saveNota(tipo, id, value) {
    const item = S[tipo]?.find(i => i.id === id);
    if (item) {
        item.notas = value;
        persist();
        const btn = document.querySelector(\`button[onclick*="\${id}"]\`);
        if(btn) btn.classList.toggle('has-nota', !!value);
    }
}

/* ═══════════════════════════════════════════════════════════
   MODAIS & TOAST
═══════════════════════════════════════════════════════════ */
function openM(id) { document.getElementById(id)?.classList.add('open'); }
function closeM(id) { document.getElementById(id)?.classList.remove('open'); }
document.querySelectorAll('.mbg').forEach(bg => {
    bg.addEventListener('click', e => { if (e.target === bg) bg.classList.remove('open'); });
});

function showConfirm(msg, onOk) {
  document.getElementById('confirm-msg').textContent = msg;
  const btn = document.getElementById('confirm-ok');
  const newBtn = btn.cloneNode(true);
  btn.parentNode.replaceChild(newBtn, btn);
  newBtn.onclick = () => { closeM('mbg-confirm'); onOk(); };
  openM('mbg-confirm');
}

let toastTimer = null;
function showToast(msg, duration = 2000) {
  const el = document.getElementById('toast');
  if (!el) return;
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), duration);
}

/* ═══════════════════════════════════════════════════════════
   INIT
═══════════════════════════════════════════════════════════ */
function init() {
    const initialTab = document.querySelector('.tab.active');
    setTab(initialTab.id.replace('tab-',''), initialTab);
    
    const initialPredioTab = document.querySelector('.predio-nav-tab.active');
    if(initialPredioTab) {
        setPredioTab(initialPredioTab.getAttribute('onclick').match(/'([^']*)'/)[1], initialPredioTab);
    }
    
    // Attach resize listener to switch kanban views
    window.addEventListener('resize', renderCaderno);
}

init();
</script>
